[package]
name = "mayak-hook"
description = "Relays Claude Code and Codex hook events to Mayak over a named pipe"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mayak_hook"
path = "src/lib.rs"

[[bin]]
name = "mayak-hook"
path = "src/main.rs"

[dependencies]
serde_json = "1"

# Our own SID and who serves the pipe; the process table for the Codex
# ancestor walk; FileSystem + IO only for the in-test pipe server.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

# The socket syscalls and peer credentials the Linux transport needs.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
