[package]
name = "mayak-hook"
description = "Relays Claude Code, Codex and Antigravity hook events to Mayak over a named pipe"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mayak_hook"
path = "src/lib.rs"

[[bin]]
name = "mayak-hook"
path = "src/main.rs"

[dependencies]
# raw_value: the questions and permission suggestions go back to Claude Code
# exactly as they arrived on stdin.
serde_json = { version = "1", features = ["raw_value"] }

# Our own SID and who serves the pipe; the process table for the Codex
# ancestor walk; FileSystem + IO only for the in-test pipe server.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_IO",
  "Win32_System_Pipes",
  "Win32_System_Threading",
] }

# The socket syscalls and peer credentials the Linux transport needs.
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
