<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mayak — greeting preview</title>
    <style>
      body { margin: 0; background: #1b1b1f; font: 12px system-ui; color: #ddd; }
      #stage { display: block; width: 640px; height: 150px; margin: 24px auto 8px; background: #000; border-radius: 0 0 22px 22px; }
      #bar { width: 640px; margin: 0 auto; display: flex; gap: 8px; align-items: center; }
      #t { flex: 1; } #clock { width: 60px; font: 600 13px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="bar">
      <button id="play">Pause</button><button id="restart">Restart</button>
      <button id="back" title="One frame back">&lsaquo;</button><button id="fwd" title="One frame forward">&rsaquo;</button>
      <button id="hold">Hover (hold)</button><button id="cut">Interrupt now</button>
      <input id="t" type="range" min="0" max="6" step="0.01" value="0" /><span id="clock">0.00 s</span>
    </div>
    <script type="module" src="./greeting-preview.ts"></script>
  </body>
</html>
