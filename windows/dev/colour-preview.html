<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mayak — colour preview</title>
    <style>
      body { margin: 0; background: #1b1b1f; font: 12px system-ui; color: #ddd; }
      #stage { display: flex; gap: 28px; align-items: flex-end; justify-content: center; width: 720px; margin: 24px auto 8px; padding: 18px 0 14px; background: #000; border-radius: 0 0 22px 22px; }
      #stage figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; }
      #stage figcaption { color: #777; font-size: 11px; }
      .bar { width: 720px; margin: 4px auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .bar button.on { background: #a78bfa; color: #000; }
      #status { width: 720px; margin: 8px auto; font: 600 12px ui-monospace, monospace; color: #aaa; }
      #sheet { display: block; margin: 12px auto; max-width: 100%; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div class="bar" id="states"></div>
    <div class="bar">
      <button id="love">Love</button><button id="annoyed">Annoyed (slap)</button>
      <button id="rapid" title="working, finished, error, 0.15 s apart">Rapid changes</button>
      <label><input id="cycle" type="checkbox" /> random state every</label><input id="every" type="number" min="0.2" max="60" step="0.1" value="3" style="width: 52px" /> s
      <label><input id="pace" type="checkbox" checked /> app frame rate</label>
      <label><input id="nogl" type="checkbox" /> 2D fallback (reload)</label>
    </div>
    <div id="status"></div>
    <canvas id="sheet" width="0" height="0"></canvas>
    <script type="module" src="./colour-preview.ts"></script>
  </body>
</html>
