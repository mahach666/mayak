<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mayak — app icons preview</title>
    <style>
      html, body { height: auto !important; overflow: auto !important; background: #1b1b1f !important; }
      body { font: 12px system-ui; color: #ddd; padding: 20px 0; }
      .panel { width: 640px; margin: 0 auto 18px; background: #000; border-radius: 0 0 22px 22px; padding: 14px 18px; }
      h2 { font: 600 12px system-ui; color: #9398a1; margin-bottom: 10px; }
      table { border-collapse: collapse; width: 100%; }
      th { font: 500 11px system-ui; color: #6b7079; text-align: left; padding: 4px 6px; }
      td { padding: 6px; vertical-align: middle; }
      td.name { color: #cdd6f4; width: 160px; white-space: nowrap; }
      td.sep { border-left: 1px solid #222; }
      .cell { display: inline-flex; gap: 10px; align-items: center; }
      .apps-real { width: 640px; height: 200px; margin: 0 auto; background: #000; border-radius: 0 0 22px 22px; }
    </style>
  </head>
  <body>
    <div class="panel">
      <h2>New icons at 16, 22, 28 and 48 px — then the old monograms</h2>
      <table id="sizes"></table>
    </div>
    <div class="panel" style="padding: 0">
      <h2 style="padding: 14px 18px 0">As in the Apps tab (28 px, real styles)</h2>
      <div id="real"></div>
    </div>
    <div class="panel">
      <h2>styledIconFor() lookups</h2>
      <table id="lookups"></table>
    </div>
    <script type="module" src="./icons-preview.ts"></script>
  </body>
</html>
